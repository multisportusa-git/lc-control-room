<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LC Control Room</title>
<style>
:root{
  --ink:#0A0A0C;--navy:#1B2B44;--surface:#14213A;--card:rgba(22,34,58,.72);--card-solid:#131e34;--card2:#0f182b;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#F5F5F7;--text2:#BCC3D3;--muted:#8A93A6;--orange:#FF6A00;--orange2:#FF8A3D;--amber:#FFB000;
  --good:#3FB98A;--warn:#F2B33D;--crit:#EF5B5B;--info:#3DA5FF;--grey:#6F7890;
  --c1:#139E8F;--c2:#D9691A;--c3:#2E86D6;--c4:#C9519A;
  --r:18px;--r2:12px;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 40px -24px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1100px 560px at 88% -12%,rgba(255,106,0,.20),transparent 62%),radial-gradient(900px 520px at -12% 8%,rgba(61,165,255,.09),transparent 60%),linear-gradient(180deg,#0A0A0C 0%,#0f1930 42%,#0c1425 100%);min-height:100vh;overflow-x:hidden}
a{color:var(--orange2);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange2);outline-offset:2px;border-radius:6px}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px 90px}
header{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding:24px 0 14px}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#FF6A00,#ff9a4d);display:grid;place-items:center;box-shadow:0 10px 30px -6px rgba(255,106,0,.55)}
.wm{font:800 27px/1 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.025em}.wm b{color:var(--orange2);font-weight:800}
.sub{color:var(--text2);font-size:13px;margin-top:5px}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.status{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px}
.sbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.sbtn{border:2px solid transparent;cursor:pointer;font-family:inherit;font-size:15px;font-weight:800;padding:10px 18px;letter-spacing:.2px;box-shadow:0 4px 14px rgba(0,0,0,.45);transition:transform .12s,filter .12s}.sbtn.r-red{background:#E5484D;color:#fff;border-color:#ff8f8f;box-shadow:0 0 0 3px rgba(229,72,77,.28),0 4px 14px rgba(0,0,0,.45)}.sbtn.r-amber{background:#F5A524;color:#1a1200;border-color:#ffd27a;box-shadow:0 0 0 3px rgba(245,165,36,.25),0 4px 14px rgba(0,0,0,.45)}.sbtn:hover{filter:brightness(1.12);transform:translateY(-1px)}.sbtn::after{content:"›";font-size:18px;line-height:0;margin-left:2px}.sbtn.r-green{background:#1F9D55;color:#fff;border-color:#6fe0a0;cursor:default}.sbtn.r-green:hover,span.sbtn:hover{filter:none;transform:none}span.sbtn::after{content:none}.phtab{width:100%;border-collapse:collapse;margin-top:12px}.phtab th{text-align:left;font-size:11px;color:var(--text2);padding:4px 8px 4px 0}.phtab td{padding:8px 8px 8px 0;border-top:1px solid rgba(255,255,255,.08);vertical-align:top}.sbtn:focus-visible{outline:2px solid var(--orange2);outline-offset:2px}
.it.flash{box-shadow:0 0 0 2px var(--orange2)}
.stamp{color:var(--muted);font-size:12px;text-align:right}
nav{position:sticky;top:0;z-index:20;background:rgba(10,10,12,.78);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:10px 16px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:6px 12px;border-radius:999px;color:var(--text2);font-weight:600;font-size:12.5px;border:1px solid var(--line);cursor:pointer;white-space:nowrap}
nav a:hover{text-decoration:none;border-color:var(--line2);color:var(--text)}
nav a .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;text-align:center}
nav .sp{flex:1}
.tbtn{flex:none;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer}
.tbtn.on{background:var(--orange);border-color:var(--orange);color:#fff}
.mod.p-V2 .tbtn.on{background:var(--v2);border-color:var(--v2);color:#0A0A0C}
/* modules */
#mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mod{grid-column:span 1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);min-width:0;scroll-margin-top:64px;transition:box-shadow .2s}
.mod.full{grid-column:1/-1}
:root{--v3:#FF8A3D;--v3bg:rgba(255,138,61,.14);--v2:#9B7BEA;--v2bg:rgba(155,123,234,.16);--vb:#8A93A6;--vbbg:rgba(138,147,166,.14)}
.mod.p-V3{box-shadow:inset 4px 0 0 var(--v3),var(--shadow)}.mod.p-V2{box-shadow:inset 4px 0 0 var(--v2),var(--shadow)}
.pg{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:6px;font:800 11px/18px -apple-system,system-ui,sans-serif;letter-spacing:.04em;color:#0A0A0C;white-space:nowrap;vertical-align:middle}
.pg-V3{background:var(--v3)}.pg-V2{background:var(--v2)}.pg-Both{background:var(--vb)}.pg-Other{background:#5d667a;color:#fff}
.rowV3{box-shadow:inset 3px 0 0 var(--v3)}.rowV2{box-shadow:inset 3px 0 0 var(--v2)}.rowBoth{box-shadow:inset 3px 0 0 var(--vb)}
.sl.pV2{border-left:4px solid var(--v2)}.sl.pV3{border-left:4px solid var(--v3)}
nav a.nV3{border-bottom:2px solid var(--v3)}nav a.nV2{border-bottom:2px solid var(--v2)}
.progseg button[data-v="V3"].on{background:var(--v3);color:#0A0A0C}.progseg button[data-v="V2"].on{background:var(--v2);color:#0A0A0C}
.v2step{width:104px}.v2step .dot{border-color:var(--v2)}.v2line .st:before{background:var(--v2)}.v2line .st.done:before{background:#4d5667}
.mod.hidden{display:none}
.mod.flash{box-shadow:0 0 0 2px var(--orange2),var(--shadow)}
.mh{display:flex;align-items:center;gap:12px;padding:14px 16px 12px}
.mi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.mt{font:700 15.5px/1.2 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.01em}
.ms{color:var(--muted);font-size:12px;margin-top:2px}
.mh .grow{flex:1;min-width:0}
.ctl{display:flex;gap:2px;opacity:.55;transition:opacity .15s}
.mod:hover .ctl,.ctl:focus-within,body.custom .ctl{opacity:1}
@media (hover:none){.ctl{opacity:1}}
.ctl button{width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--text2);cursor:pointer;display:grid;place-items:center}
.ctl button:hover{background:rgba(255,255,255,.08);color:var(--text)}
.ctl .hide{display:none}body.custom .ctl .hide{display:grid}
.mb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}
.mb>div{overflow:hidden;min-width:0}
.mod.col .mb{grid-template-rows:0fr}
.mod.col .mh{padding-bottom:14px}
.mbi{padding:0 16px 16px}
.help{display:none;margin:0 16px 12px;padding:10px 12px;border-radius:10px;background:rgba(61,165,255,.08);border:1px solid rgba(61,165,255,.25);color:var(--text2);font-size:12.5px}
.mod.showhelp .help{display:block}
@media (prefers-reduced-motion:reduce){.mb,.panel{transition:none!important}}
/* generic */
.grid{display:grid;gap:12px}
.k6{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.tile{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:var(--r2);padding:14px;position:relative;overflow:hidden}
.tile .lab{color:var(--text2);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.tile .val{font:800 30px/1.1 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.025em;margin-top:6px}
.tile .val small{font-size:14px;color:var(--muted);font-weight:600}
.tile .foot{color:var(--muted);font-size:12px;margin-top:5px}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--line2)}
.ringrow{display:flex;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.r-green{background:rgba(63,185,138,.14);color:#86e3bd;border-color:rgba(63,185,138,.35)}
.r-amber{background:rgba(242,179,61,.14);color:#ffd27a;border-color:rgba(242,179,61,.4)}
.r-red{background:rgba(239,91,91,.16);color:#ffa0a0;border-color:rgba(239,91,91,.45)}
.r-blue{background:rgba(61,165,255,.14);color:#a3d4ff;border-color:rgba(61,165,255,.35)}
.r-grey{background:rgba(138,147,166,.12);color:#c0c7d6;border-color:rgba(138,147,166,.3)}
.mdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.why{color:var(--muted);font-size:12px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px}
.inp{padding:8px 10px;border-radius:10px;border:1px solid var(--line2);background:#0c1424;color:var(--text);font-size:13px}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--text2);padding:5px 11px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.seg button.on{background:#F5F5F7;color:#0A0A0C;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.bar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;white-space:nowrap}
th.sort{cursor:pointer}
td.n,th.n{text-align:right;font-family:var(--mono)}
tr.click{cursor:pointer}tr.click:hover td{background:rgba(255,255,255,.035)}
.scroll{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--text2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.dash{height:0;border-top:2px dashed currentColor;border-radius:0;width:14px;vertical-align:3px}
svg text{fill:var(--muted);font:11px -apple-system,system-ui,sans-serif}
/* sitrep */
.sit{display:grid;gap:8px}
.sl{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.sl .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:13px}
.sl.red{background:rgba(239,91,91,.08);border-color:rgba(239,91,91,.3)}
.sl a{font-family:var(--mono);font-weight:700}
/* issues */
.iss{display:grid;gap:8px}
.it{border-left:4px solid var(--grey);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.035);cursor:pointer}
.it:hover{background:rgba(255,255,255,.06)}
.it.red{border-color:var(--crit)}.it.amber{border-color:var(--warn)}
.own{border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13px;border:1px solid var(--line)}
.own.you{background:rgba(255,176,0,.10);border-color:rgba(255,176,0,.35)}
.own.claude{background:rgba(63,185,138,.08);border-color:rgba(63,185,138,.3);color:var(--text2)}.own.claude b{color:var(--text)}
.own.owes{background:rgba(242,179,61,.10);border-color:rgba(242,179,61,.45)}
.own.miss{border-color:rgba(239,91,91,.5)}
.impact{font-size:12.5px;color:var(--text);margin-top:4px}
.askshort .own{margin:6px 0 0}.abtn{margin-top:8px;gap:8px;flex-wrap:wrap}
.askcard{padding:16px;margin-bottom:12px}
.askcard h6{margin:14px 0 4px;color:var(--orange2);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.askcard ol.asksteps,.askcard ul.askknow{margin:0;padding-left:20px;color:var(--text2)}.askcard li{margin:4px 0}
.cmdbox{display:flex;gap:8px;align-items:flex-start;background:rgba(0,0,0,.28);border:1px solid var(--line2);border-radius:10px;padding:8px 8px 8px 12px}
.cmdbox code{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;color:var(--text)}
.miss-line{margin-top:10px;color:var(--crit);font-weight:600}
.plandet{margin-top:16px;border-top:1px solid var(--line);padding-top:8px}.plandet summary{cursor:pointer;color:var(--text2);font-size:13px}
.it .act{color:var(--orange2);font-size:12.5px;margin-top:4px}
/* board */
.board{background:#07090d;border:1px solid #1d232c;border-radius:14px;overflow:hidden}
.bhead,.brow{display:grid;grid-template-columns:86px 76px minmax(0,1fr) 150px 150px;gap:12px;align-items:center;padding:10px 16px}
.bhead{background:#0d1117;color:#7b8496;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.bgrp{padding:7px 16px;background:#0a0d12;color:var(--orange2);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;border-top:1px solid #171c24}
.brow{border-top:1px solid #12161d;cursor:pointer}
.brow:hover,.brow:focus{background:#0f141b;outline:none}
.eta{font-family:var(--mono);color:var(--amber);font-size:17px;font-weight:700;letter-spacing:.02em;line-height:1.1}
.eta small{display:block;font-size:10.5px;color:#8b7a52;font-weight:600;letter-spacing:0}
.eta.done{color:#566072}
.tid{font-family:var(--mono);font-weight:700}
.ttl{color:#f8e9c9;font-weight:600}
/* gantt */
.gantt{position:relative;overflow-x:auto}
.gin{min-width:760px;position:relative}
.gaxis{display:grid;grid-template-columns:110px 1fr;font-size:11px;color:var(--muted)}
.gticks{position:relative;height:20px}
.gticks span{position:absolute;transform:translateX(-50%)}
.grow2{display:grid;grid-template-columns:110px 1fr;align-items:center;min-height:34px;border-top:1px solid var(--line)}
.glab{font-size:12px;color:var(--text2);font-weight:600;padding-right:8px}
.gtrack{position:relative;height:34px}
.gbar{position:absolute;top:6px;height:22px;border-radius:7px;font:700 11px/22px var(--mono);color:#0A0A0C;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:pointer;box-shadow:0 0 0 2px var(--card-solid)}
.gbar.done{opacity:.45}
.gbar.ms{width:12px!important;padding:0;border-radius:3px;transform:rotate(45deg) scale(.8);top:11px;height:12px}
.gnow{position:absolute;top:0;bottom:0;width:2px;background:var(--orange);box-shadow:0 0 12px var(--orange)}
.gnow b{position:absolute;top:-2px;left:4px;font-size:10.5px;color:var(--orange2);white-space:nowrap}
.gridl{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.05)}
/* tube */
.tube{overflow-x:auto;padding:4px 0}
.tline{display:flex;align-items:flex-start;min-width:max-content;padding:0 6px}
.st{width:116px;text-align:center;position:relative;cursor:pointer}
.st:before{content:"";position:absolute;top:13px;left:0;right:0;height:8px;background:var(--orange)}
.st:first-child:before{left:50%}.st:last-child:before{right:50%}
.st.done:before{background:#4d5667}
.st .dot{position:relative;width:34px;height:34px;margin:0 auto;border-radius:50%;background:#fff;border:6px solid var(--grey);display:grid;place-items:center;font-size:12px;font-weight:900;color:#0A0A0C}
.st .nm{font-family:var(--mono);font-weight:800;margin-top:6px;font-size:12px}
.st .tt{font-size:11px;color:var(--text2);padding:0 6px;line-height:1.25;height:2.5em;overflow:hidden}
.st .tm{font-family:var(--mono);color:var(--amber);font-size:12px}
.pathlab{font-size:12px;color:var(--text2);font-weight:700;margin:4px 0 6px;text-transform:uppercase;letter-spacing:.08em}
/* week */
.week{display:grid;grid-template-columns:repeat(8,minmax(148px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;margin-top:12px}
.day{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px}
.day.today{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange) inset}
.day h4{margin:0 0 8px;font-size:11.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between}
.chip{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--grey);background:rgba(255,255,255,.04);color:var(--text);border-radius:6px;padding:5px 7px;margin-bottom:5px;font-size:12px;line-height:1.3;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.08)}
.chip b{font-family:var(--mono);font-size:11px}
/* bars */
.hbar{display:grid;grid-template-columns:minmax(90px,210px) 1fr 70px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.hbar.click{cursor:pointer}
.track{height:14px;background:rgba(255,255,255,.05);border-radius:4px;display:flex;overflow:hidden;gap:2px}
.track span{display:block;height:100%}
.track span:last-child{border-radius:0 4px 4px 0}
.hbar .v{font-family:var(--mono);text-align:right;color:var(--text2)}
.gauge{height:10px;border-radius:5px;background:rgba(255,255,255,.07);position:relative;overflow:visible;margin-top:6px}
.gauge>span{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.gauge i{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.35)}
/* panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.panel{position:fixed;top:0;right:0;height:100%;width:min(640px,100%);background:linear-gradient(180deg,#131e34,#0c1324);border-left:1px solid #2b3a57;z-index:50;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:22px 20px 60px;box-shadow:-30px 0 60px rgba(0,0,0,.4)}
.panel.on{transform:none}.scrim.on{display:block}
.panel .x{position:sticky;top:0;float:right;background:#1d2a45;border:1px solid #2b3a57;border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer;z-index:2}
.panel h3{margin:0 0 4px;font:700 20px/1.25 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.01em;padding-right:44px}
.panel .meta{color:var(--text2);font-size:13px;margin-bottom:12px}
.panel h5{margin:18px 0 6px;color:var(--orange2);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em}
.panel ol,.panel ul{margin:0;padding-left:20px;color:var(--text2)}
.panel li{margin:4px 0}
.box{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text2);white-space:pre-wrap;word-break:break-word}
.callout{border-left:4px solid var(--grey);padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);margin:10px 0}
.callout.red{border-color:var(--crit)}.callout.amber{border-color:var(--warn)}.callout.green{border-color:var(--good)}.callout.blue{border-color:var(--info)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini .tile{padding:10px}.mini .val{font-size:20px}
.tip{position:fixed;pointer-events:none;z-index:60;background:#0b1220;border:1px solid #2b3a57;border-radius:9px;padding:8px 10px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;max-width:290px}
footer{color:var(--muted);font-size:12px;margin-top:36px;border-top:1px solid var(--line);padding-top:14px}

function secAmp(E){

 let svg=`<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sessions: requests vs peak context">`;
 [[20,'20 req','rgba(255,255,255,.12)'],[50,'50 req','var(--eff-orange)']].forEach(([v,l,c])=>{const xv=x(v);svg+=`<line x1="${xv}" x2="${xv}" y1="${pt}" y2="${H-pb}" stroke="${c}" stroke-dasharray="4 4"/><text x="${xv}" y="${pt-2}" text-anchor="middle" style="font-size:10px">${l}</text>`});
 [[125000,'125k ctx','rgba(255,255,255,.12)'],[175000,'175k','var(--eff-amber)']].forEach(([v,l,c])=>{const yv=y(v);svg+=`<line x1="${pl}" x2="${W-8}" y1="${yv}" y2="${yv}" stroke="${c}" stroke-dasharray="4 4"/><text x="${pl-4}" y="${yv+4}" text-anchor="end" style="font-size:10px">${l}</text>`});
 [0,50,100,150].forEach(v=>{svg+=`<text x="${pl-4}" y="${y(v*1000)+4}" text-anchor="end">${v}k</text>`});
 [0,20,40,60,80].forEach(v=>{svg+=`<text x="${x(v)}" y="${H-8}" text-anchor="middle">${v}</text>`});
 svg+=`<text x="${W/2}" y="${H-2}" text-anchor="middle" style="fill:var(--muted)">Requests</text><text x="10" y="${H/2}" text-anchor="middle" transform="rotate(-90,10,${H/2})" style="fill:var(--muted)">Peak ctx</text>`;
 sessions.forEach(s=>{const col=ROLE_COL[s.role]||'var(--muted)';svg+=`<circle cx="${x(s.requests||0)}" cy="${y(s.peak_ctx||0)}" r="5" fill="${col}" stroke="var(--eff-surf1)" stroke-width="1.5" opacity=".85"><title>${eesc(s.sid)} · ${eesc(s.task_id||'?')} · ${s.requests}req · ${efmt(s.peak_ctx)} ctx</title></circle>`});
 svg+=`</svg>`;

function secTests(E){
 const tests=E.tests||[];if(!tests.length)return`<div class="empty">No test job data.</div>`;
 const byClass={full:0,focused:0,train:0,main:0};tests.forEach(t=>{byClass[t.class]=(byClass[t.class]||0)+(t.minutes||0)});
 const totalMin=tests.reduce((a,t)=>a+(t.minutes||0),0);
 const fps=tests.map(t=>t.fingerprint).filter(Boolean);const uniqFps=new Set(fps);const dupFps=fps.length-uniqFps.size;
 const passed=tests.filter(t=>t.result==='PASS').length,failed=tests.filter(t=>t.result==='FAIL').length;
 const gates={allowed:0,refused:0,flake_retry:0,exception:0};tests.forEach(t=>{if(t.gate)gates[t.gate]=(gates[t.gate]||0)+1});

 <div class="pathlab" style="margin-bottom:8px">Minutes by class</div>
 ${['full','focused','train','main'].map(c=>`<div class="hbar"><div>${c}</div><div class="track"><span style="width:${(byClass[c]||0)/maxM*100}%;background:${barCol[c]}"></span></div><div class="v">${(byClass[c]||0).toFixed(1)} min</div></div>`).join('')}

 <div style="display:flex;flex-wrap:wrap;gap:8px">${Object.entries(gates).filter(([,n])=>n>0).map(([k,n])=>`<span class="eff-chip ${k==='refused'?'no':k==='exception'?'no':'yes'}">${eesc(k)} ${n}</span>`).join('')}</div>

 <div class="hbar"><div>Total jobs</div><div class="track"><span style="width:100%;background:var(--eff-blue)"></span></div><div class="v">${tests.length}</div></div>
 <div class="hbar"><div>PASS</div><div class="track"><span style="width:${(passed/Math.max(1,tests.length)*100).toFixed(1)}%;background:var(--eff-green)"></span></div><div class="v">${passed}</div></div>

function secDups(E){

function secCircuit(E){
 const events=E.circuit||[];
 if(!events.length)return`<div class="empty">No circuit events recorded.</div>`;
 const stateCol={closed:'var(--eff-green)','half-open':'var(--eff-amber)',open:'var(--eff-red)'};
 const W2=Math.min(700,window.innerWidth-80),H2=80,pl2=20,pb2=24;

 const t0=Math.min(...times),t1=Math.max(...times,t0+1);
 const xT=t=>pl2+(t-t0)/(t1-t0)*(W2-pl2-12);
 let svg=`<svg width="100%" viewBox="0 0 ${W2} ${H2}" role="img" aria-label="Circuit timeline">`;
 events.forEach((e,i)=>{const t=new Date(e.ts).getTime();const x0=xT(t);const x1=i<events.length-1?xT(new Date(events[i+1].ts).getTime()):W2-12;const c=stateCol[e.state]||'var(--muted)';svg+=`<rect x="${x0}" y="${pb2}" width="${Math.max(4,x1-x0)}" height="32" fill="${c}" rx="3" opacity=".7"><title>${eesc(e.state)} @ ${eesc(e.ts)} ${e.reason_class?'· '+eesc(e.reason_class):''}</title></rect>`});
 events.filter((_,i)=>i===0||i===events.length-1).forEach(e=>{const t=new Date(e.ts).getTime();svg+=`<text x="${xT(t)}" y="${H2-4}" text-anchor="middle" style="font-size:10px">${new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</text>`});
 svg+=`</svg>`;
 const leg=Object.entries(stateCol).map(([k,c])=>`<span><i style="background:${c};display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-2px;margin-right:4px"></i>${k}</span>`).join('');
 const trips=events.filter(e=>e.state==='open').length;
 return svg+`<div class="legend">${leg}</div><div class="why">${trips} open trip${trips!==1?'s':''} · ${events.length} transitions total</div>`}

 const t=await fetchEnc(true);if(t&&t!==window._ENC)liveUpdate(t)},ghTok()?15000:75000)}

/* ---------- loader: passphrase, fetch, decrypt (AES-256-CBC + PBKDF2-SHA256, openssl enc format), gunzip ---------- */
const ITER=200000;
const API_URL="https://api.github.com/repos/multisportusa-git/lc-control-room/contents/w1.enc?ref=data";
function ghT(){try{return localStorage.getItem("w1dash.gt")||""}catch(e){return""}}
async function fetchEnc(apiOnly){const t=ghT();
 if(apiOnly||t){try{const r=await fetch(API_URL+"&t="+Date.now(),{cache:"no-store",headers:Object.assign({"Accept":"application/vnd.github.raw"},t?{"Authorization":"Bearer "+t}:{})});if(r.ok)return (await r.text()).trim()}catch(e){}if(apiOnly)return null}
 const r=await fetch(DATA_URL+"?t="+Math.floor(Date.now()/60000),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return (await r.text()).trim()}
async function encryptTxt(txt,pass){/* same format as openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -base64 -A */
 const salt=crypto.getRandomValues(new Uint8Array(8));
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},km,384));
 const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["encrypt"]);
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,new TextEncoder().encode(txt)));
 const out=new Uint8Array(16+ct.length);out.set(new TextEncoder().encode("Salted__"),0);out.set(salt,8);out.set(ct,16);
 let s="";for(let i=0;i<out.length;i+=8192)s+=String.fromCharCode.apply(null,out.subarray(i,i+8192));return btoa(s)}
async function decryptRaw(b64,pass){/* openssl format -> UTF-8 text, no gzip (tests and chat) */
 const raw=Uint8Array.from(atob(b64.replace(/\s+/g,"")),c=>c.charCodeAt(0));
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:raw.slice(8,16),iterations:ITER,hash:"SHA-256"},km,384));
 const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,raw.slice(16)))}
async function decrypt(b64,pass){
 const raw=Uint8Array.from(atob(b64.replace(/\s+/g,"")),c=>c.charCodeAt(0));
 if(new TextDecoder().decode(raw.slice(0,8))!=="Salted__")throw new Error("Unexpected data format");
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
 const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:raw.slice(8,16),iterations:ITER,hash:"SHA-256"},km,384));
 const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
 const gz=await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,raw.slice(16));
 const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
 return JSON.parse(txt);
}

async function load(){
 if(EMBED)return app(EMBED);
 const hp=new URLSearchParams(location.hash.slice(1));
 if(hp.get("gt")){try{localStorage.setItem("w1dash.gt",hp.get("gt"))}catch(x){}hp.delete("gt");history.replaceState(null,"",location.pathname+(hp.toString()?"#"+hp:""));}
 if(hp.get("k")){try{localStorage.setItem("w1dash.k",hp.get("k"))}catch(x){}hp.delete("k");history.replaceState(null,"",location.pathname+(hp.toString()?"#"+hp:""));}
 let pass=null;try{pass=localStorage.getItem("w1dash.k")}catch(x){}
 if(!pass)return lockScreen("");
 let txt;try{txt=await fetchEnc(false)}
 catch(e){document.getElementById("mods").innerHTML=`<div class="mod full"><div class="mbi" style="padding:20px">Could not fetch the data (${String(e.message||e)}). The page retries in a minute.</div></div>`;setTimeout(load,60000);return}
 let D;try{D=await decrypt(txt,pass)}catch(e){try{localStorage.removeItem("w1dash.k")}catch(x){}return lockScreen("That passphrase did not open the data.")}
 /* a newer copy fetched by the freshness poll (the CDN can lag by minutes) wins */
 try{const c=JSON.parse(sessionStorage.getItem("w1dash.enc")||"null");if(c&&c.t!==txt&&Date.now()-c.at<15*60000){const D2=await decrypt(c.t,pass);if(Date.parse(D2.gen_iso)>Date.parse(D.gen_iso)){D=D2;txt=c.t}}}catch(e){}
 window._ENC=txt;window._PASS=pass;
 app(D);
}
load();
